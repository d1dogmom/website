<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | D1 Dog Mom</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>

    <h1>Production Login</h1>

    <form>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">Log In</button>
    </form>

    <p>
        <a href="../../">Return to D1 Dog Mom</a>
    </p>

</body>
</html>
